name: Windows release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - shell: pwsh
        env:
          WARDLENS_PFX_BASE64: ${{ secrets.WARDLENS_PFX_BASE64 }}
          WARDLENS_PFX_PASSWORD: ${{ secrets.WARDLENS_PFX_PASSWORD }}
        run: .\scripts\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: WardLens-Windows
          path: dist/release/*
          if-no-files-found: error
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Assets = Get-ChildItem "dist\release" -File | ForEach-Object { $_.FullName }
          $Provenance = Get-Content "dist\release\BUILD_PROVENANCE.txt" -Raw
          $ReleaseArgs = @("release", "create", "${{ github.ref_name }}") + $Assets + @("--verify-tag", "--generate-notes", "--title", "WardLens ${{ github.ref_name }}", "--notes", $Provenance)
          if ($Provenance -match "UNSIGNED BUILD") { $ReleaseArgs += "--prerelease" }
          & gh @ReleaseArgs

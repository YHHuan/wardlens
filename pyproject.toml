[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wardlens"
version = "0.2.0"
description = "Privacy-first portable rounding assistant for Taiwanese inpatient clinicians"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "WardLens contributors"}]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "keyring>=25,<26",
  "python-docx>=1.1,<2",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.15,<7",
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
wardlens = "wardlens.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wardlens = ["resources/prompts/*.txt", "resources/demo/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

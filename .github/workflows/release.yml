name: Windows release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - shell: pwsh
        run: .\scripts\build_windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: WardLens-Windows
          path: dist/release/*
          if-no-files-found: error
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $Assets = Get-ChildItem "dist\release" -File | ForEach-Object { $_.FullName }
          $Provenance = Get-Content "dist\release\BUILD_PROVENANCE.txt" -Raw
          $Notes = @"
          $Provenance

          Download WardLens-Portable.zip, extract the entire archive, then double-click WardLens.exe. Keep runtime/app/packages beside the EXE; Start-WardLens.bat remains available for diagnostics. This is a clinical pilot build and is not validated for autonomous decisions or EMR write-back.
          "@
          $ReleaseArgs = @("release", "create", "${{ github.ref_name }}") + $Assets + @("--verify-tag", "--generate-notes", "--title", "WardLens ${{ github.ref_name }} portable pilot", "--notes", $Notes, "--prerelease")
          & gh @ReleaseArgs
